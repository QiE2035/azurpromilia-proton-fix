[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apfix"
version = "0.1.0"
description = "Make the Azur Promilia SDK overlay (policy gate + login window) work under Proton/Wine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "apfix contributors" }]
keywords = ["proton", "wine", "linux", "azur-promilia", "binary-patching", "steam-deck"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "psutil>=5.9",
  "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
apfix = "apfix.cli:run"

[project.urls]
Homepage = "https://github.com/QiE2035/azurpromilia-proton-fix"
Documentation = "https://github.com/QiE2035/azurpromilia-proton-fix/tree/main/docs"
Issues = "https://github.com/QiE2035/azurpromilia-proton-fix/issues"
Changelog = "https://github.com/QiE2035/azurpromilia-proton-fix/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/apfix"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 本项目注释/文档用中文，全角标点是有意的
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
